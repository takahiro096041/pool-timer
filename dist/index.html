<html>
  <head>
    <title>タイマーアプリ</title>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta http-equiv="Content-Style-Type" content="text/css" />
    <meta http-equiv="Content-Script-Type" content="text/javascript" />
    <meta name="content-language" content="ja" />
    <meta name="Description" content="" />
    <meta name="Keywords" content="" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1.0,minimum-scale=1.0,maximum-scale=1.0,user-scalable=no"
    />
    <link href="style.css" rel="stylesheet" />
    <script type="text/javascript" defer src="vue.js"></script>
    <script type="text/javascript" defer src="modal-component.js"></script>
    <script type="text/javascript" defer src="timer.js"></script>
  </head>
  <body>
    <div class="main" v-cloak>
      <div class="content">
        <div class="timer">
          <div class="time">{{realTime}}</div>
          <button class="time-stop" @click="stopTimer()">{{pause}}</button>
          <button class="time-thirty" @click="start40()">
            ショット間<br />{{defaultTime}}秒
          </button>
          <!-- <button class="time-one-m" @click="start1Minute()">
            ブレイク後<br />1分
          </button> -->
          <div class="extension-part">
            <button class="extension" @click="extension1()" :disabled="ext1">
              extension<br />player1
            </button>
            <button class="extension" @click="extension2()" :disabled="ext2">
              extension<br />player2
            </button>
          </div>
          <button class="reset" @click="reset()">extリセット</button>
          <button class="setting" @click="openModal()">設定</button>
          <modal-component :show="showModal" @close="showModal = false">
            <div class="setting-time">
              <div class="title">ショット時間の設定</div>
              <div>
                <input
                  type="radio"
                  id="time40"
                  value="40"
                  name="time"
                  v-model="selectedTime"
                />
                <label for="time40">40秒</label>
              </div>
              <div>
                <input
                  type="radio"
                  id="time30"
                  value="30"
                  name="time"
                  v-model="selectedTime"
                />
                <label for="time30">30秒</label>
              </div>
              <button @click="saveTime()">保存</button>
            </div>
          </modal-component>
        </div>
      </div>
    </div>
  </body>
</html>
